[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "barrier-sizing"
version = "1.0.0"
description = "Simulation study of power-law drawdown-modulated position sizing"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Max Silverman"}]
keywords = ["quantitative-finance", "drawdown", "position-sizing",
            "risk-management", "portfolio-optimization"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Science/Research",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = ["numpy>=1.24", "pandas>=2.0", "matplotlib>=3.7"]

[project.optional-dependencies]
data = ["yfinance>=0.2.40"]

[tool.setuptools]
packages = ["barrier_sizing"]
